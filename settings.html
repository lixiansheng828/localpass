<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalPass · 设置</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            width: 600px;
            color: #2d3748;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f1f3f5;
        }

        .section h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f3f5;
        }

        .input-group {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            flex: 1;
        }

        .field-hint {
            display: block;
            font-size: 11px;
            color: #718096;
            margin-top: 4px;
            font-weight: normal;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 6px;
            transition: all 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #4299e1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-primary,
        .btn-outline {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3182ce 0%, #2c5282 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
        }

        .btn-outline {
            background: white;
            border: 1px solid #e2e8f0;
            color: #4a5568;
        }

        .btn-outline:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
            transform: translateY(-1px);
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .password-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .password-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #718096;
        }

        .strength-container {
            margin-top: 8px;
        }

        .master-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(108, 117, 125, 0.05);
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6c757d;
        }

        .status-dot.set {
            background: #28a745;
        }

        .status-dot.empty {
            background: #17a2b8;
        }

        .hint {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #718096;
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(108, 117, 125, 0.05);
            border-radius: 8px;
        }

        .footer {
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
        }

        #status {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            min-height: 20px;
        }

        #status.success {
            background: rgba(72, 187, 120, 0.1);
            color: #22543d;
        }

        #status.error {
            background: rgba(245, 101, 101, 0.1);
            color: #742a2a;
        }

        #status.info {
            background: rgba(66, 153, 225, 0.1);
            color: #2c5282;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a202c 0%, #0d1219 100%);
                color: #e2e8f0;
            }

            .header h1 {
                color: #e2e8f0;
            }

            .section {
                background: #2d3748;
                border-color: #4a5568;
            }

            .section h3 {
                color: #e2e8f0;
                border-bottom-color: #4a5568;
            }

            label {
                color: #cbd5e0;
            }

            input[type="number"] {
                background: #4a5568;
                border-color: #718096;
                color: #e2e8f0;
            }

            .field-hint {
                color: #a0aec0;
            }

            .btn-outline {
                background: #2d3748;
                border-color: #4a5568;
                color: #e2e8f0;
            }

            .btn-outline:hover {
                background: #4a5568;
            }

            .btn-secondary {
                background: #4a5568;
            }

            .btn-secondary:hover {
                background: #718096;
            }

            .password-input {
                background: #4a5568;
                border-color: #718096;
                color: #e2e8f0;
            }

            .master-status {
                background: rgba(74, 85, 104, 0.3);
            }

            .hint {
                background: rgba(74, 85, 104, 0.3);
                color: #a0aec0;
            }

            .footer {
                border-top-color: #4a5568;
                color: #718096;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>⚙️</span>
                LocalPass 设置
            </h1>
        </div>

        <div class="section">
            <h3>🖱️ 点击触发</h3>
            <div class="input-group">
                <label>
                    触发点击次数
                    <input type="number" id="clickCount" min="2" max="10" value="5">
                    <span class="field-hint">2-10次</span>
                </label>
                <label>
                    点击间隔(ms)
                    <input type="number" id="clickInterval" min="100" max="1000" value="300">
                    <span class="field-hint">100-1000ms</span>
                </label>
                <label>
                    最大点击次数
                    <input type="number" id="maxClickCount" min="5" max="20" value="10">
                    <span class="field-hint">5-20次</span>
                </label>
            </div>
        </div>

        <div class="section">
            <h3>🔐 安全</h3>

            <!-- 主密码管理 -->
            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f1f3f5;">
                <h4 style="margin: 0 0 12px 0; font-size: 14px; font-weight: 600; color: #4a5568;">主密码管理</h4>
                <div class="master-status" id="masterStatus">
                    <span class="status-dot" id="masterDot"></span>
                    <span id="masterStatusText">检查中...</span>
                </div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="password" id="masterInput" class="password-input" placeholder="请输入主密码">
                        <span class="input-icon">🔐</span>
                    </div>
                    <button id="setMasterBtn" class="btn-primary" style="flex: 0 0 auto; padding: 10px 20px;">设置/修改</button>
                </div>
                <div id="passwordStrengthContainer" class="strength-container"></div>
                <div class="hint" style="margin-top: 12px;">
                    <span>💡</span>
                    <span>首次设置留空将以明文存储密码；修改时需先输入当前密码</span>
                </div>
            </div>

            <div class="input-group">
                <label>
                    PBKDF2 迭代次数
                    <input type="number" id="pbkdf2Iterations" min="100000" max="500000" value="200000">
                    <span class="field-hint">10万-50万</span>
                </label>
                <label>
                    最小密码长度
                    <input type="number" id="minPasswordLength" min="1" max="20" value="4">
                    <span class="field-hint">1-20字符</span>
                </label>
            </div>
            <div style="display: flex; gap: 16px; margin-top: 12px;">
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" id="masterPasswordWarning" checked>
                    主密码设置警告
                </label>
            </div>
        </div>

        <div class="section">
            <h3>🎨 界面</h3>
            <div class="input-group">
                <label>
                    面板最大高度(px)
                    <input type="number" id="panelMaxHeight" min="200" max="500" value="260">
                    <span class="field-hint">200-500px</span>
                </label>
                <label>
                    面板宽度(px)
                    <input type="number" id="panelWidth" min="200" max="400" value="280">
                    <span class="field-hint">200-400px</span>
                </label>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" id="autoClosePanel" checked>
                    填充后自动关闭面板
                </label>
                <label style="display: flex; align-items: center;">
                    <input type="checkbox" id="showSuccessNotifications" checked>
                    显示操作成功提示
                </label>
            </div>
        </div>

        <div class="button-group">
            <button id="saveSettings" class="btn-primary">
                💾 保存设置
            </button>
            <button id="resetSettings" class="btn-outline">
                ↩️ 恢复默认
            </button>
        </div>

        <div id="status"></div>

        <div class="footer">
            LocalPass v2.0.0 · 数据完全本地存储
        </div>
    </div>

    <script src="settings.js"></script>
</body>

</html>
